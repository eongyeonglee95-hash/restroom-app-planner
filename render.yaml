services:
  # 정적 사이트(프론트)는 무료이고 중지되지 않는다. 백엔드는 OSRM(약 280MB)이 붙어
  # 유료 인스턴스(512MB 이상)가 필요해서 별도로 켠다 - 지금은 이 파일에 정의만 해두고
  # Blueprint sync 대신 대시보드에서 Static Site를 수동으로 만드는 방식으로 배포한다
  # (Blueprint sync는 아래 backend 서비스도 함께 생성해 곧바로 유료 과금이 시작된다).
  - type: web
    name: chamjima-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_KAKAO_MAP_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false

  # 2026-08-10: 무료로 배포하려고 백엔드는 Google Cloud Run으로 옮겼다(README "배포" 항목
  # 참고). 이 블록은 나중에 Render 유료 인스턴스로 돌아갈 경우를 위해 남겨둔다 - 지금의
  # backend/Dockerfile(OSRM 포함, 약 1GB 필요)에는 더 이상 유효하지 않은 plan: free를
  # 빼놨으니, 쓰려면 1GB 이상 유료 플랜을 직접 골라야 한다.
  - type: web
    name: chamjima-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: SEOUL_PHARMACY_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
