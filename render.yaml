services:
  # 정적 사이트(프론트)는 무료이고 중지되지 않는다. 백엔드는 OSRM(약 280MB)이 붙어
  # 유료 인스턴스(512MB 이상)가 필요해서 별도로 켠다 - 지금은 이 파일에 정의만 해두고
  # Blueprint sync 대신 대시보드에서 Static Site를 수동으로 만드는 방식으로 배포한다
  # (Blueprint sync는 아래 backend 서비스도 함께 생성해 곧바로 유료 과금이 시작된다).
  - type: web
    name: chamjima-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_KAKAO_MAP_KEY
        sync: false
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: chamjima-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: SEOUL_PHARMACY_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
