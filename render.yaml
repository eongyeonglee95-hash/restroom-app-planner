services:
  - type: web
    name: chamjima-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: TMAP_APP_KEY
        sync: false
      - key: SEOUL_PHARMACY_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
