spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chamjima}
spring.datasource.username=${DB_USERNAME:chamjima}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

kakao.rest-api-key=${KAKAO_REST_API_KEY:}
tmap.app-key=${TMAP_APP_KEY:}

app.import.restrooms.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

