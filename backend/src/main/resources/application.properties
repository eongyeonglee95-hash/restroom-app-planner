spring.application.name=backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/chamjima}
spring.datasource.username=${DB_USERNAME:chamjima}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

kakao.rest-api-key=${KAKAO_REST_API_KEY:}
tmap.app-key=${TMAP_APP_KEY:}
seoul.pharmacy-api-key=${SEOUL_PHARMACY_API_KEY:}

app.import.restrooms.enabled=false
app.import.pharmacies.enabled=false
app.import.night-duty-pharmacies.enabled=false
# 공공데이터 원본 중복(같은 화장실이 여러 관리번호로 수록)을 대표 행으로 묶는다.
# 화장실 임포트로 새 행이 들어온 뒤 한 번 켜서 실행하면 된다.
app.dedup.restrooms.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 사용량 측정(Actuator). 공개 서비스에서 지표가 그대로 노출되면 안 되므로 별도 포트로
# 뺀다 - 배포 시 이 포트는 외부에 열지 않는다(PaaS는 보통 포트 하나만 공개한다).
# 앱 자체의 헬스체크는 기존 /api/health를 그대로 쓴다.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,metrics

# 도보 경로 계산용 자체 OSRM(foot 프로필). 준비 방법은 README 참고.
# 공개 데모 서버(router.project-osrm.org)를 넣지 말 것 - 소요시간이 자동차 속도로 나오고,
# 서비스 트래픽을 보내면 안 되는 개발용 서버다.
app.routing.osrm.base-url=${OSRM_BASE_URL:http://localhost:5001}

